# A flood node with a subregion much larger than the output subregion must
# render the same as one whose subregion matches the output.
---
root:
  items:
    - type: stacking-context
      bounds: [40, 40, 40, 40]
      filters:
        - svgfe: SourceGraphic
        - svgfe: SourceAlpha
        - svgfe: gaussianblur
          linear: false
          subregion: [20, 20, 100, 100]
          std_deviation_x: 4
          std_deviation_y: 4
          in: 1
        - svgfe: offset
          linear: false
          subregion: [20, 20, 100, 100]
          offset: [3, 3]
          in: 2
        - svgfe: flood
          linear: false
          subregion: [20, 20, 100, 100]
          color: [0, 0, 0, 0.6]
        - svgfe: compositein
          linear: false
          subregion: [20, 20, 100, 100]
          in: 4
          in2: 3
        - svgfe: compositeover
          linear: false
          subregion: [20, 20, 100, 100]
          in: 0
          in2: 5
      items:
        - type: rect
          bounds: [48, 48, 19, 16]
          color: [40, 90, 220, 1]
    - type: stacking-context
      bounds: [200, 40, 40, 40]
      filters:
        - svgfe: SourceGraphic
        - svgfe: SourceAlpha
        - svgfe: gaussianblur
          linear: false
          subregion: [180, 20, 100, 100]
          std_deviation_x: 4
          std_deviation_y: 4
          in: 1
        - svgfe: offset
          linear: false
          subregion: [180, 20, 100, 100]
          offset: [3, 3]
          in: 2
        - svgfe: flood
          linear: false
          subregion: [180, 20, 100, 100]
          color: [0, 0, 0, 0.6]
        - svgfe: compositein
          linear: false
          subregion: [180, 20, 100, 100]
          in: 4
          in2: 3
        - svgfe: compositeover
          linear: false
          subregion: [180, 20, 100, 100]
          in: 0
          in2: 5
      items:
        - type: rect
          bounds: [208, 48, 19, 16]
          color: [40, 90, 220, 1]
    - type: stacking-context
      bounds: [40, 200, 40, 40]
      filters:
        - svgfe: SourceGraphic
        - svgfe: SourceAlpha
        - svgfe: gaussianblur
          linear: false
          subregion: [20, 180, 100, 100]
          std_deviation_x: 4
          std_deviation_y: 4
          in: 1
        - svgfe: offset
          linear: false
          subregion: [20, 180, 100, 100]
          offset: [3, 3]
          in: 2
        - svgfe: flood
          linear: false
          subregion: [20, 180, 100, 100]
          color: [0, 0, 0, 0.6]
        - svgfe: compositein
          linear: false
          subregion: [20, 180, 100, 100]
          in: 4
          in2: 3
        - svgfe: compositeover
          linear: false
          subregion: [20, 180, 100, 100]
          in: 0
          in2: 5
      items:
        - type: rect
          bounds: [48, 208, 19, 16]
          color: [40, 90, 220, 1]
    - type: stacking-context
      bounds: [200, 200, 40, 40]
      filters:
        - svgfe: SourceGraphic
        - svgfe: SourceAlpha
        - svgfe: gaussianblur
          linear: false
          subregion: [180, 180, 100, 100]
          std_deviation_x: 4
          std_deviation_y: 4
          in: 1
        - svgfe: offset
          linear: false
          subregion: [180, 180, 100, 100]
          offset: [3, 3]
          in: 2
        - svgfe: flood
          linear: false
          subregion: [180, 180, 100, 100]
          color: [0, 0, 0, 0.6]
        - svgfe: compositein
          linear: false
          subregion: [180, 180, 100, 100]
          in: 4
          in2: 3
        - svgfe: compositeover
          linear: false
          subregion: [180, 180, 100, 100]
          in: 0
          in2: 5
      items:
        - type: rect
          bounds: [208, 208, 19, 16]
          color: [40, 90, 220, 1]
