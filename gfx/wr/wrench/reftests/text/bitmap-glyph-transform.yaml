# A rotated (non-axis-aligned) transform must apply to embedded-bitmap glyphs.
# Baking an identity glyph shape for bitmap fonts draws them axis-aligned and
# displaced (bug 2055177); the reference image shows the glyphs carrying the
# rotation, which is the result the screen raster path must produce.
root:
  items:
    - type: stacking-context
      bounds: [0, 0, 300, 200]
      transform: rotate(20)
      transform-origin: [150, 100]
      items:
        - text: "0123456789"
          origin: 40 110
          size: 20
          font: "Proggy.ttf"
          embedded-bitmaps: true
